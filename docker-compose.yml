services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: loadlab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  target-api:
    build: ./services/target-api
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/loadlab
      REDIS_URL: redis://redis:6379
      PORT: 3000
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: ./services/target-api
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/loadlab
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: 5
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  control-api:
    build: ./services/control-api
    environment:
      TARGET_API_URL: http://target-api:3000
      ROW_COUNT: 1000000
      PORT: 4000
    ports: ["4000:4000"]
    depends_on:
      - target-api

volumes:
  pgdata:
